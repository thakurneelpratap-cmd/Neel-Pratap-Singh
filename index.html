<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neel Pratap Singh | Personal Website</title>
<style>
html,body{margin:0;min-height:100%;background:#090909;color:#f5f0e6;font-family:Arial,sans-serif}
#status{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
#status p{color:#e7bd61}
</style>
</head>
<body>
<div id="status"><div><h2>Neel Pratap Singh</h2><p>Loading website…</p></div></div>
<script>
(async function(){
  try {
    const parts = await Promise.all([
      fetch('./site-part-1.txt').then(r=>{if(!r.ok)throw new Error('part 1');return r.text()}),
      fetch('./site-part-2.txt').then(r=>{if(!r.ok)throw new Error('part 2');return r.text()}),
      fetch('./site-part-3.txt').then(r=>{if(!r.ok)throw new Error('part 3');return r.text()}),
      fetch('./site-part-4.txt').then(r=>{if(!r.ok)throw new Error('part 4');return r.text()}),
      fetch('./site-part-5.txt').then(r=>{if(!r.ok)throw new Error('part 5');return r.text()}),
      fetch('./site-part-6.txt').then(r=>{if(!r.ok)throw new Error('part 6');return r.text()})
    ]);
    document.open();
    document.write(parts.join(''));
    document.close();
  } catch (error) {
    document.getElementById('status').innerHTML =
      '<div><h2>Website is being prepared</h2><p>Please refresh in a moment.</p></div>';
  }
})();
</script>
</body>
</html>
